name: Health check

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay scheduled runs a bit)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: healthcheck
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: health

      - name: Load previous results
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/status-data/status.json?t=$(date +%s)" -o prev.json \
            || echo '{"sites":[]}' > prev.json

      - name: Check sites
        id: check
        run: python3 health/check.py health/sites.json prev.json status.json >> "$GITHUB_OUTPUT"

      - name: Save results to the status-data branch
        run: |
          mkdir out && cp status.json out/ && cd out
          git init -q -b status-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -q -m "Health check $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" status-data

      - name: Alert (fails the run so GitHub emails you)
        if: steps.check.outputs.alert == '1'
        run: |
          echo "::error::${{ steps.check.outputs.message }}"
          exit 1
