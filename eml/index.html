<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email Safety Check</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb;
          --ok:#16a34a; --okbg:#f0fdf4; --med:#d97706; --medbg:#fffbeb; --high:#dc2626; --highbg:#fef2f2; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:900px; margin:0 auto; padding:24px 16px 64px; }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .back { font-size:13.5px; color:var(--muted); text-decoration:none; }
  .lang { display:flex; gap:4px; }
  .lang button { border:1px solid var(--line); background:#fff; color:var(--muted); border-radius:6px; padding:4px 10px; font-size:12.5px; cursor:pointer; }
  .lang button.on { background:var(--text); color:#fff; border-color:var(--text); }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 20px; }
  .drop { border:2px dashed #cbd5e1; border-radius:12px; background:var(--card); padding:28px; text-align:center; color:var(--muted); cursor:pointer; transition:.15s; }
  .drop.over { border-color:var(--accent); background:#eff6ff; color:var(--accent); }
  .drop b { color:var(--text); }
  .hint { font-size:13px; color:var(--muted); }
  .verdict { margin-top:18px; border-radius:12px; padding:18px 20px; border:1px solid var(--line); background:var(--card); }
  .verdict.ok { background:var(--okbg); border-color:#86efac; }
  .verdict.med { background:var(--medbg); border-color:#fcd34d; }
  .verdict.high { background:var(--highbg); border-color:#fca5a5; }
  .verdict h2 { margin:0 0 4px; font-size:20px; }
  .verdict.ok h2 { color:var(--ok); } .verdict.med h2 { color:var(--med); } .verdict.high h2 { color:var(--high); }
  .verdict p { margin:0; font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; margin-top:14px; overflow:hidden; }
  .card h3 { margin:0; font-size:14px; padding:12px 16px; border-bottom:1px solid var(--line); background:#fafafa; }
  .finding { display:flex; gap:10px; padding:9px 16px; font-size:14px; border-top:1px solid var(--line); align-items:flex-start; }
  .finding:first-of-type { border-top:none; }
  .pill { flex:none; font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; margin-top:1px; min-width:64px; text-align:center; }
  .pill.high { background:var(--highbg); color:var(--high); } .pill.med { background:var(--medbg); color:var(--med); }
  .pill.low { background:#f3f4f6; color:#4b5563; } .pill.ok { background:var(--okbg); color:var(--ok); }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th, td { text-align:left; padding:8px 16px; border-top:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; width:150px; }
  td.mono, .mono { font-family:ui-monospace,Consolas,monospace; font-size:12.5px; word-break:break-all; }
  thead th { border-top:none; background:#fafafa; width:auto; }
  td:nth-child(2) { white-space:nowrap; }
  a.vt { color:var(--accent); font-weight:600; white-space:nowrap; font-size:13px; }
  pre.body { margin:0; padding:12px 16px; white-space:pre-wrap; word-break:break-word; font-size:13px; max-height:320px; overflow:auto; font-family:inherit; }
  .empty { padding:10px 16px; font-size:14px; color:var(--muted); }
  .note { margin-top:20px; font-size:12.5px; color:var(--muted); line-height:1.6; }
  .err { margin-top:14px; color:var(--high); font-size:14px; }
</style>
</head>
<body>
<main>
  <div class="topbar">
    <a class="back" href="../" data-i18n="back"></a>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en">EN</button><button data-lang="ko">한국어</button>
    </div>
  </div>
  <h1 data-i18n="title"></h1>
  <p class="sub" data-i18n="sub"></p>

  <div class="drop" id="drop">
    <span id="dropLabel" data-i18n="drop"></span>
    <input type="file" id="file" accept=".eml,message/rfc822" hidden>
  </div>
  <div id="err" class="err"></div>
  <div id="out"></div>
  <p class="note" data-i18n="note"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.2/dist/jszip.min.js"></script>

// The English drop hint above was a draft; keep it short and clear.
T.en.drop = "<b>Drop an .eml file here</b> or click to choose";

let lang = "";
try { lang = localStorage.getItem("usSmLang") || ""; } catch (e) {}
if (!T[lang]) lang = /^ko/i.test(navigator.language || "") ? "ko" : "en";
const t = (k, ...a) => { const v = T[lang][k] ?? T.en[k]; return typeof v === "function" ? v(...a) : v; };
let last = null, lastName = null;
function applyLang() {
  document.documentElement.lang = lang;
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    if (el.id === "dropLabel" && lastName) return;
    el.innerHTML = t(el.dataset.i18n);
  });
  document.querySelectorAll(".lang button").forEach((b) => b.classList.toggle("on", b.dataset.lang === lang));
  if (last) render(last);
}
document.querySelectorAll(".lang button").forEach((b) => b.onclick = () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("usSmLang", lang); } catch (e) {}
  applyLang();
});
applyLang();

// ---------- helpers ----------
const $ = (id) => document.getElementById(id);
function h(tag, attrs = {}, ...kids) {

// ---------- analysis ----------
async function analyze(email) {
  scanBudget = 0;
  const F = []; // {lv: high|med|low|ok, key, args}
  const add = (lv, key, ...args) => F.push({ lv, key, args });
  const hdr = (k) => email.headers.filter((x) => x.key === k).map((x) => x.value);

  // sender
  const fromAddr = email.from?.address || "";
  const fromName = email.from?.name || "";
  const fromDom = domainOf(fromAddr);
  const replyTo = (email.replyTo || []).map((a) => a.address).filter(Boolean);
  const returnPath = email.returnPath || "";

  // authentication (topmost header = added by our receiving server)
  const ar = hdr("authentication-results")[0] || hdr("arc-authentication-results")[0] || "";
  const pick = (re) => { const m = re.exec(ar); return m ? m[1].toLowerCase() : null; };
  let spf = pick(/\bspf=(\w+)/i), dkim = pick(/\bdkim=(\w+)/i), dmarc = pick(/\bdmarc=(\w+)/i);
  if (/\bdkim=pass/i.test(ar)) dkim = "pass";
  if (!spf) { const r = hdr("received-spf")[0]; if (r) spf = (/^\s*(\w+)/.exec(r) || [])[1]?.toLowerCase() || null; }
  const authStr = `SPF: ${spf || "-"} · DKIM: ${dkim || "-"} · DMARC: ${dmarc || "-"}`;
  if (dmarc === "fail") add("high", "fDmarcFail");
  if (spf === "fail" || spf === "softfail") add(dmarc === "pass" ? "low" : "med", "fSpfFail", spf);
  if (dkim === "fail") add(dmarc === "pass" ? "low" : "med", "fDkimFail");
  if (!spf && !dkim && !dmarc) add("low", "fAuthNone");
  if (spf === "pass" && dkim === "pass" && dmarc === "pass") add("ok", "fAuthPass");

  if (fromDom) {
    const lk = lookalikeOf(fromDom);
    if (lk) add("high", "fLookalike", fromDom, lk);
    if (isPunyOrUnicode(fromDom)) add("high", "fPunyFrom", fromDom);
    if (FREEMAIL.has(fromDom)) add("low", "fFreemail", fromDom);
  }
  const nameMail = /[\w.+-]+@([\w-]+\.)+[a-z]{2,}/i.exec(fromName);
  if (nameMail && domainOf(nameMail[0]) !== fromDom) add("high", "fNameAddr", fromName, fromDom);
  for (const r of replyTo) {
    const rd = domainOf(r);
    if (rd && fromDom && baseDomain(rd) !== baseDomain(fromDom)) { add(FREEMAIL.has(rd) || lookalikeOf(rd) ? "high" : "med", "fReplyTo", rd, fromDom); break; }
  }
  const rpd = domainOf(returnPath);
  if (rpd && fromDom && baseDomain(rpd) !== baseDomain(fromDom)) add("low", "fReturnPath", rpd, fromDom);

  // links
  const links = [];
  const seen = new Set();
  let bodyText = email.text || "";
  let hasForm = false;
  if (email.html) {
    const doc = new DOMParser().parseFromString(email.html, "text/html"); // inert: no scripts run, no images load
    hasForm = !!doc.querySelector("form, input[type=password]");
    for (const a of doc.querySelectorAll("a[href], area[href]")) {
      const href = (a.getAttribute("href") || "").trim();
      if (!href || href.startsWith("#") || /^mailto:|^tel:/i.test(href)) continue;
      const text = (a.textContent || "").replace(/\s+/g, " ").trim();
      const key = href + "|" + text;
      if (!seen.has(key)) { seen.add(key); links.push({ href, text }); }
    }
    if (!bodyText) bodyText = (doc.body?.innerText || doc.body?.textContent || "").replace(/\n{3,}/g, "\n\n");
  }
  for (const m of (email.text || "").matchAll(/\bhttps?:\/\/[^\s<>"')\]]+/gi)) {
    const href = m[0].replace(/[.,;:]+$/, "");
    if (![...seen].some((k) => k.startsWith(href + "|"))) { seen.add(href + "|"); links.push({ href, text: "" }); }
  }
  // attachments (deep: zip contents, Office macros, PDF scripts, attached emails)
  const atts = [];
  for (const a of email.attachments || []) {
    const name = a.filename || (a.mimeType === "message/rfc822" ? "message.eml" : "(no name)");
    const buf = typeof a.content === "string" ? new TextEncoder().encode(a.content).buffer : a.content;
    await scanFile({ name, type: a.mimeType || "", u8: new Uint8Array(buf), path: "", depth: 0, deep: !!a.rfc822DepthExceeded }, add, atts, links);
  }

  if (hasForm) add("high", "fForm");

  for (const L of links) {
    L.checks = [];
    if (/^\s*(javascript|data|vbscript|file):/i.test(L.href)) { add("high", "fJsLink", L.href.slice(0, 80)); L.bad = "high"; continue; }
    let u; try { u = new URL(L.href); } catch { continue; }

    const host = u.hostname.toLowerCase();
    L.host = host;
    const once = (k, lv, key, ...a) => { if (!flagged.has(k)) { flagged.add(k); add(lv, key, ...a); } L.bad = L.bad === "high" ? "high" : lv; };

    if (isPunyOrUnicode(host)) once("pu" + host, "high", "fPunyLink", host);
    const lk = lookalikeOf(host); if (lk) once("lk" + host, "high", "fLookLink", host, lk);
    if (SHORTENERS.has(host.replace(/^www\./, ""))) once("sh" + host, "med", "fShort", host);
    const fx = extOf(u.pathname);
    if (RISKY.has(fx) || HTMLX.has(fx) && fx !== "html" && fx !== "htm" || MACRO.has(fx) || ARCH.has(fx)) once("fx" + L.href, RISKY.has(fx) ? "high" : "med", "fFileLink", L.href.slice(0, 100));

    if (tm) {
      const shown = tm[1].toLowerCase();
      if (baseDomain(shown) !== baseDomain(host)) once("tm" + shown + host, "high", "fTextMismatch", shown, host);
    }
  }
  if (httpCount) add("low", "fHttp", httpCount);

  // wording
  const hay = ((email.subject || "") + "\n" + bodyText).toLowerCase();
  const hits = [...WORDS.en, ...WORDS.ko].filter((w) => hay.includes(w.toLowerCase()));
  if (hits.length) add(hits.length >= 3 ? "med" : "low", "fWords", hits.slice(0, 6).join(", "));

  // verdict
  const n = (lv) => F.filter((f) => f.lv === lv).length;
  const verdict = n("high") ? "high" : (n("med") || n("low") >= 3) ? "med" : "ok";
  const order = { high: 0, med: 1, low: 2, ok: 3 };
  F.sort((a, b) => order[a.lv] - order[b.lv]);

  return {
    verdict, findings: F, links, atts, authStr,
    from: fromName ? `${fromName} <${fromAddr}>` : fromAddr,
    replyTo: replyTo.join(", "), returnPath,
    to: (email.to || []).map((x) => x.address || x.name).join(", "),
    subject: email.subject || "", date: email.date || "",
    body: bodyText.trim().slice(0, 4000),
  };
}

  out.append(h("div", { class: "card" }, h("h3", { text: `${t("secAtt")} (${r.atts.length})` }),
    r.atts.length ? h("table", {}, h("thead", {}, h("tr", {}, h("th", { text: t("colFile") }), h("th", { text: t("colSize") }), h("th", { text: t("colType") }), h("th", { text: t("colCheck") }))), h("tbody", {}, attRows))
      : h("div", { class: "empty", text: t("noAtt") })));

  out.append(h("div", { class: "card" }, h("h3", { text: t("secBody") }), h("pre", { class: "body", text: r.body || t("noBody") })));
