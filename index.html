<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SM Line USA Tools</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#6b7280; --line:#e3e6eb; --accent:#2b5bd7; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:760px; margin:48px auto; padding:0 20px; }
  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
  h1 { font-size:24px; margin:0 0 6px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 24px; }
  .lang { display:flex; gap:4px; flex:none; }
  .lang button { border:1px solid var(--line); background:#fff; color:var(--muted); border-radius:6px; padding:4px 10px; font-size:12.5px; cursor:pointer; }
  .lang button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .search { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:12px; }
  a.card { display:block; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; text-decoration:none; color:inherit; transition:.12s; }
  a.card:hover { border-color:var(--accent); box-shadow:0 2px 10px rgba(43,91,215,.08); }
  .tag { display:inline-block; font-size:11.5px; color:var(--accent); background:#eef3ff; border-radius:999px; padding:2px 8px; margin-bottom:8px; }
  .card h2 { font-size:16px; margin:0 0 6px; }
  .card p { font-size:13.5px; color:var(--muted); margin:0; line-height:1.5; }
  .empty { color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1 data-i18n="title"></h1>
      <p class="sub" data-i18n="sub"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en">EN</button><button data-lang="ko">한국어</button>
    </div>
  </div>
  <input class="search" id="q" type="search">
  <div class="grid" id="grid"></div>
</main>
<script>
(() => {
  // Tools are listed in tools.json: add a folder + one entry there to add a tool.
  const T = {
    en: { title: 'SM Line USA Tools', sub: 'Internal tools. Everything runs in your browser.', search: 'Search tools', none: 'No tools found.', loadErr: 'Could not load the tool list.' },
    ko: { title: 'SM Line USA 도구 모음', sub: '사내 업무용 도구입니다. 모든 처리는 브라우저 안에서 이루어집니다.', search: '도구 검색', none: '검색 결과가 없습니다.', loadErr: '도구 목록을 불러오지 못했습니다.' }
  };
  const KEY = 'usSmLang';
  let lang = '';
  try { lang = localStorage.getItem(KEY) || ''; } catch (e) {}
  if (!T[lang]) lang = /^ko/i.test(navigator.language || '') ? 'ko' : 'en';
  let tools = null, err = false;
  const pick = v => (v && typeof v === 'object') ? (v[lang] || v.en || '') : (v || '');
  const grid = document.getElementById('grid'), q = document.getElementById('q');

  function render() {
    document.documentElement.lang = lang;
    document.title = T[lang].title;
    document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = T[lang][el.dataset.i18n]);
    document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
    q.placeholder = T[lang].search;
    grid.innerHTML = '';
    if (err) { grid.innerHTML = '<p class="empty"></p>'; grid.firstChild.textContent = T[lang].loadErr; return; }
    if (!tools) return;
    const term = q.value.trim().toLowerCase();
    const shown = tools.filter(t => !term || [t.name, t.desc].some(v => Object.values(v || {}).join(' ').toLowerCase().includes(term)) || (t.tag || '').toLowerCase().includes(term));
    if (!shown.length) { grid.innerHTML = '<p class="empty"></p>'; grid.firstChild.textContent = T[lang].none; return; }
    for (const t of shown) {
      const a = document.createElement('a');
      a.className = 'card'; a.href = t.path;
      if (t.tag) { const s = document.createElement('span'); s.className = 'tag'; s.textContent = t.tag; a.appendChild(s); }
      const h = document.createElement('h2'); h.textContent = pick(t.name); a.appendChild(h);
      const p = document.createElement('p'); p.textContent = pick(t.desc); a.appendChild(p);
      grid.appendChild(a);
    }
  }
  document.querySelectorAll('.lang button').forEach(b => b.onclick = () => {
    lang = b.dataset.lang;
    try { localStorage.setItem(KEY, lang); } catch (e) {}
    render();
  });
  q.oninput = render;
  render();
  fetch('tools.json', { cache: 'no-cache' }).then(r => r.json()).then(j => { tools = j; render(); }).catch(() => { err = true; render(); });
})();
</script>
</body>
</html>
